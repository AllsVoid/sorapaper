name: 功能建议
description: 提出能改善 SoraPaper 使用体验的功能建议。
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法。请描述具体使用场景和期望结果，避免在 Issue 中提交敏感信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有重复建议。
          required: true
        - label: 此建议适合 SoraPaper 的静态优先、低客户端 JavaScript 的定位。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 请说明当前工作流中的困难，以及受影响的用户或场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 请描述期望的行为、配置方式或界面效果；可附草图或示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选。请说明现有的临时解决方式或其他可行方案。
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可选。包括兼容性、性能、无障碍或迁移方面的考虑。
